<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent Analyst</title>
<!--
  A thin client over the existing JSON API: POST /runs, GET /runs/{id},
  POST /runs/{id}/review. No build step and no framework, so the page is one
  version-controlled file that FastAPI serves as-is (see api.py, GET /).

  marked renders the Markdown report. DOMPurify sanitizes its HTML output:
  the report is written by an LLM from fetched web pages, i.e. untrusted text,
  and inserting it with innerHTML unsanitized would let a crafted page inject
  script into this origin (which can call the API). Versions are pinned so a
  CDN release can't change the page under us.
-->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5f6b7a;
    --border: #dfe3e8;
    --accent: #2f5bea;
    --accent-hover: #2449c4;
    --ok: #1a7f4b;
    --warn: #a15c00;
    --err: #b42318;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { margin: 0 0 24px; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    min-height: 84px;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secondary { background: var(--card); color: var(--text); border-color: var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }
  button.approve { background: var(--ok); }
  button.approve:hover:not(:disabled) { background: #146a3e; }
  .hint { color: var(--muted); font-size: 0.875rem; }

  /* Status line: pill + thread id + message */
  #status-card { display: none; }
  .status-line { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #eef1f5;
    color: var(--muted);
  }
  .pill[data-state="running"], .pill[data-state="pending"] { background: #e8eefd; color: var(--accent); }
  .pill[data-state="awaiting_review"] { background: #fdf3e2; color: var(--warn); }
  .pill[data-state="done"] { background: #e3f4ea; color: var(--ok); }
  .pill[data-state="failed"] { background: #fde8e6; color: var(--err); }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thread { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; color: var(--muted); }
  #message { margin: 10px 0 0; }
  #message:empty { display: none; }
  #message.error { color: var(--err); }

  /* Review panel */
  #review-card { display: none; border-color: #f0d9b0; }
  #review-card h2, #report-card h2.card-title { font-size: 1.05rem; margin: 0 0 4px; }
  .critique { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .draft {
    max-height: 480px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 16px;
    margin-bottom: 14px;
    background: #fbfbfc;
  }

  #report-card { display: none; }

  /* Rendered Markdown */
  .md h1 { font-size: 1.45rem; margin: 0.6em 0 0.4em; }
  .md h2 { font-size: 1.2rem; margin: 1.4em 0 0.4em; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 1.05rem; margin: 1.2em 0 0.3em; }
  .md p, .md ul, .md ol { margin: 0.6em 0; }
  .md a { color: var(--accent); overflow-wrap: anywhere; }
  .md code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .md pre { background: #eef1f5; padding: 12px; border-radius: 8px; overflow: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md blockquote { margin: 0.6em 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .md.plain { white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Multi-Agent Analyst</h1>
    <p>Ask a research question. A supervisor plans it, specialists search the web, documents and data, a critic checks the draft, and you approve the result.</p>
  </header>

  <form id="ask-form" class="card">
    <label for="question" class="hint">Your question</label>
    <textarea id="question" name="question" minlength="3" maxlength="1000" required
              placeholder="e.g. Summarize the company's revenue trend and key risks, with sources"></textarea>
    <div class="row">
      <button id="ask-btn" type="submit">Ask</button>
      <span class="hint">Ctrl+Enter to send · a run takes a few minutes</span>
    </div>
  </form>

  <section id="status-card" class="card" aria-live="polite">
    <div class="status-line">
      <span id="pill" class="pill" data-state="pending"><span id="pill-text">pending</span></span>
      <span id="thread" class="thread"></span>
    </div>
    <p id="message"></p>
    <div class="row" id="retry-row" hidden>
      <button id="retry-btn" type="button" class="secondary">Retry</button>
    </div>
  </section>

  <section id="review-card" class="card">
    <h2>Review the draft</h2>
    <p id="critique" class="critique"></p>
    <div id="draft" class="draft md"></div>
    <label for="feedback" class="hint">Feedback (what should change?)</label>
    <textarea id="feedback" maxlength="2000" placeholder="e.g. Add more on supply-chain risks"></textarea>
    <div class="row">
      <button id="approve-btn" type="button" class="approve">Approve</button>
      <button id="feedback-btn" type="button" class="secondary">Send feedback</button>
    </div>
  </section>

  <section id="report-card" class="card">
    <div id="report" class="md"></div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // Why polling, not WebSockets/SSE: the API already exposes GET /runs/{id},
  // runs take minutes, and status changes a handful of times per run. A 2 s
  // poll is plenty responsive, needs no new server code, and survives server
  // restarts and proxies with no reconnect logic: the next poll just works.
  const POLL_MS = 2000;
  // Tolerate brief blips (server restarting, Wi-Fi hiccup) before giving up,
  // so one dropped request doesn't end the session.
  const MAX_NETWORK_ERRORS = 5;

  const $ = (id) => document.getElementById(id);
  const els = {
    form: $("ask-form"), question: $("question"), askBtn: $("ask-btn"),
    statusCard: $("status-card"), pill: $("pill"), pillText: $("pill-text"),
    thread: $("thread"), message: $("message"), retryRow: $("retry-row"), retryBtn: $("retry-btn"),
    reviewCard: $("review-card"), critique: $("critique"), draft: $("draft"),
    feedback: $("feedback"), approveBtn: $("approve-btn"), feedbackBtn: $("feedback-btn"),
    reportCard: $("report-card"), report: $("report"),
  };

  let threadId = null;
  let pollTimer = null;
  let networkErrors = 0;

  // ---- rendering ----------------------------------------------------------
  function renderMarkdown(target, markdown) {
    // If the CDN scripts didn't load (offline, blocked), still show the text
    // rather than failing: textContent never interprets HTML, so it's safe.
    if (window.marked && window.DOMPurify) {
      target.classList.remove("plain");
      target.innerHTML = DOMPurify.sanitize(marked.parse(markdown || ""));
      // Sources are external pages: open them in a new tab without giving
      // that page a handle back to this one.
      target.querySelectorAll("a[href]").forEach((a) => {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      });
    } else {
      target.classList.add("plain");
      target.textContent = markdown || "";
    }
  }

  function setStatus(state, message = "", isError = false) {
    els.statusCard.style.display = "block";
    els.pill.dataset.state = state;
    els.pillText.textContent = state.replace("_", " ");
    // Spinner only while the system is working; awaiting_review is waiting on *you*.
    const spinning = state === "pending" || state === "running";
    const existing = els.pill.querySelector(".spinner");
    if (spinning && !existing) {
      const s = document.createElement("span");
      s.className = "spinner";
      els.pill.prepend(s);
    } else if (!spinning && existing) {
      existing.remove();
    }
    els.thread.textContent = threadId ? `run ${threadId}` : "";
    els.message.textContent = message;
    els.message.classList.toggle("error", isError);
    els.retryRow.hidden = true;
  }

  function showError(message, retry) {
    setStatus("failed", message, true);
    if (retry) {
      els.retryRow.hidden = false;
      els.retryBtn.onclick = retry;
    }
    els.askBtn.disabled = false;
  }

  function hidePanels() {
    els.reviewCard.style.display = "none";
    els.reportCard.style.display = "none";
  }

  function setReviewBusy(busy) {
    els.approveBtn.disabled = busy;
    els.feedbackBtn.disabled = busy;
  }

  // ---- HTTP ---------------------------------------------------------------
  // Turns HTTP errors into exceptions carrying FastAPI's `detail`, so every
  // caller can show a readable message. A network failure (fetch rejects)
  // is marked separately because it's worth retrying; a 4xx is not.
  async function api(method, path, body) {
    let response;
    try {
      response = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (err) {
      const e = new Error("Can't reach the server. Is it running?");
      e.network = true;
      throw e;
    }
    let data = null;
    try { data = await response.json(); } catch (_) { /* non-JSON error page */ }
    if (!response.ok) {
      let detail = data && data.detail;
      // 422 validation errors come as a list of {msg, ...}.
      if (Array.isArray(detail)) detail = detail.map((d) => d.msg).join("; ");
      const e = new Error(detail || `HTTP ${response.status}`);
      e.status = response.status;
      // 5xx (e.g. a proxy's 502 while the server restarts) is transient too.
      e.network = response.status >= 500;
      throw e;
    }
    return data;
  }

  // ---- polling ------------------------------------------------------------
  function stopPolling() {
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  function schedulePoll(delay = POLL_MS) {
    stopPolling();
    pollTimer = setTimeout(poll, delay);
  }

  async function poll() {
    if (!threadId) return;
    let info;
    try {
      info = await api("GET", `/runs/${encodeURIComponent(threadId)}`);
      networkErrors = 0;
    } catch (err) {
      if (err.network && ++networkErrors < MAX_NETWORK_ERRORS) {
        setStatus("running", `${err.message} Retrying (${networkErrors}/${MAX_NETWORK_ERRORS - 1})...`, true);
        schedulePoll(POLL_MS * networkErrors);  // back off a little each time
        return;
      }
      networkErrors = 0;
      showError(err.status === 404 ? "This run no longer exists on the server." : err.message,
                err.status === 404 ? null : () => { setStatus("running", "Reconnecting..."); poll(); });
      return;
    }
    handle(info);
  }

  // One place maps the API's status to what the page shows. The review gate
  // is detected from the API's own status field: GET /runs/{id} returns
  // "awaiting_review" (plus the review payload) when the graph is paused at
  // the human gate's interrupt(). The UI doesn't guess from timing or text.
  function handle(info) {
    switch (info.status) {
      case "running":
        hidePanels();
        setStatus("running", "Agents are researching and writing. This page updates by itself.");
        schedulePoll();
        break;

      case "awaiting_review":
        stopPolling();  // nothing changes until you decide; no point polling
        showReview(info.review || {});
        setStatus("awaiting_review", "The critic accepted a draft. Approve it, or send feedback for a revision.");
        els.askBtn.disabled = false;
        break;

      case "done":
        stopPolling();
        els.reviewCard.style.display = "none";
        renderMarkdown(els.report, info.report || "_The run finished without a report._");
        els.reportCard.style.display = "block";
        setStatus("done", "");
        els.askBtn.disabled = false;
        break;

      case "failed":
        stopPolling();
        hidePanels();
        showError(`The run failed: ${info.error || "unknown error"}`, null);
        break;

      default:
        stopPolling();
        showError(`Unexpected status from the server: ${info.status}`, null);
    }
  }

  function showReview(review) {
    // `preview` is the draft exactly as the final report will look (numbered
    // citations + Sources), so you approve what the reader will get.
    renderMarkdown(els.draft, review.preview || review.draft || "");
    const c = review.critique;
    const bits = [];
    if (c) {
      bits.push(`Critic verdict: ${c.verdict}${c.score != null ? ` (score ${c.score})` : ""}`);
    }
    if (review.revision_count) bits.push(`revisions: ${review.revision_count}`);
    if (review.research_rounds) bits.push(`extra research rounds: ${review.research_rounds}`);
    els.critique.textContent = bits.join(" · ");
    els.feedback.value = "";
    setReviewBusy(false);
    els.reportCard.style.display = "none";
    els.reviewCard.style.display = "block";
  }

  // ---- actions ------------------------------------------------------------
  async function ask(question) {
    stopPolling();
    hidePanels();
    threadId = null;
    els.askBtn.disabled = true;
    // "pending" exists only here, between the click and the server's 202:
    // the API itself never reports it.
    setStatus("pending", "Starting the run...");
    try {
      const info = await api("POST", "/runs", { question });
      threadId = info.thread_id;
      // Keep the run in the URL so a reload (or a shared link) picks it back
      // up; the server keeps run state in its checkpoint DB, not the browser.
      history.replaceState(null, "", `#run=${threadId}`);
      handle(info);
    } catch (err) {
      showError(err.message, null);
    }
  }

  async function review(approved) {
    const feedback = els.feedback.value.trim();
    if (!approved && !feedback) {
      els.feedback.focus();
      els.message.textContent = "Write what should change before sending feedback.";
      els.message.classList.add("error");
      return;
    }
    setReviewBusy(true);
    try {
      const info = await api("POST", `/runs/${encodeURIComponent(threadId)}/review`,
                             approved ? { approved: true } : { approved: false, feedback });
      els.reviewCard.style.display = "none";
      handle(info);  // "running" -> resumes polling
    } catch (err) {
      setReviewBusy(false);
      if (err.status === 409) {
        // Someone (another tab, the CLI) already decided: re-sync with the server.
        setStatus("running", "This draft was already reviewed elsewhere. Refreshing...");
        poll();
      } else {
        els.message.textContent = `Couldn't send the review: ${err.message}`;
        els.message.classList.add("error");
      }
    }
  }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = els.question.value.trim();
    if (q.length >= 3) ask(q);
  });
  els.question.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) els.form.requestSubmit();
  });
  els.approveBtn.addEventListener("click", () => review(true));
  els.feedbackBtn.addEventListener("click", () => review(false));

  // Resume a run from the URL (#run=<id>) after a reload.
  const match = location.hash.match(/^#run=([\w-]+)$/);
  if (match) {
    threadId = match[1];
    setStatus("running", "Reconnecting to your run...");
    poll();
  }
})();
</script>
</body>
</html>
